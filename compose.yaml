services:
  lldap:
    image: lldap/lldap:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LLDAP_HTTP_PORT:-17170}:17170"
      - "127.0.0.1:${LLDAP_LDAP_PORT:-3890}:3890"
    environment:
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:?Set LLDAP_JWT_SECRET in .env.local}
      LLDAP_KEY_SEED: ${LLDAP_KEY_SEED:?Set LLDAP_KEY_SEED in .env.local}
      LLDAP_LDAP_BASE_DN: ${LLDAP_LDAP_BASE_DN:-dc=hackohio,dc=local}
      LLDAP_LDAP_USER_PASS: ${LLDAP_LDAP_USER_PASS:?Set LLDAP_LDAP_USER_PASS in .env.local}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/lldap:/data
