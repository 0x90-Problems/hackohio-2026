# Deploys the web app to Cloudflare (NSB-84) when main changes, alongside Vercel until the move
# is finished. Does nothing until the repository has the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets. App settings and keys are Worker secrets in Cloudflare, not here;
# only the NEXT_PUBLIC_* values the browser needs are build-time repository variables.
name: Cloudflare

on:
  push:
    branches: [main]
    paths: ["web/**", "shared/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_MULTI_ORG: ${{ vars.NEXT_PUBLIC_MULTI_ORG }}
      NEXT_PUBLIC_MCP_URL: ${{ vars.NEXT_PUBLIC_MCP_URL }}
      NEXT_PUBLIC_BOARD_API_URL: ${{ vars.NEXT_PUBLIC_BOARD_API_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Skip until Cloudflare is set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets aren't set yet; nothing deployed."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.ready.outputs.go == 'true'
        working-directory: web
        run: npm ci
      - if: steps.ready.outputs.go == 'true'
        working-directory: web
        run: npm run cf:deploy
