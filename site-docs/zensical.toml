# NutShell documentation site. Build with: zensical build (from this folder).
# See README.md here for setup.

[project]
site_name = "NutShell docs"
site_description = "How to use NutShell from programs (API) and AI agents (MCP)."
repo_url = "https://github.com/0x90-Problems/hackohio-2026"
repo_name = "0x90-Problems/hackohio-2026"
copyright = "Copyright 2026 0x90 Problems"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/nutshell.css"]
nav = [
  { "Overview" = "index.md" },
  { "API" = [
    { "Using the API" = "api/index.md" },
    { "Endpoints" = "api/endpoints.md" },
  ] },
  { "MCP" = [
    { "Connecting agents" = "mcp/index.md" },
    { "Tool reference" = "mcp/tools.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# NutShell palette: red for the primary color only, neutral gray elsewhere. No blue or purple.
# "custom" takes its colors from stylesheets/nutshell.css.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
